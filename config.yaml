# Dashboard configuration (non-secret options).
#
# Secrets (WEBSCORER_API_ID, WEBSCORER_API_TOKEN) belong in .env, not here.
#
# Environment variables never override these options. A missing option uses
# its built-in default. Run with --config <path> to use a different file.
#
# Edits to this file apply while the app runs; only source, race_id and data_file
# need a restart. An invalid edit is ignored and the last good settings keep running.

# --- Race / data source ---
# Ingestion provider: webscorer (live API or a saved JSON dump) or csv (a spreadsheet
# export; needs data_file). Restart required.
source: webscorer
# WebScorer race ID. null = prompt for a race at startup. Restart required.
race_id: null
# File the provider reads instead of the network (a WebScorer JSON dump, or the CSV
# for source csv). No credentials needed when set. Restart required.
data_file: null

# --- Timing ---
# Seconds between WebScorer API polls.
refresh_interval: 60
# Seconds the summary page displays.
summary_display_time: 20
# Scroll speed in pixels per second.
scroll_speed: 100
# Seconds to pause before and after scrolling.
scroll_pause_time: 2

# --- Pages ---
show_summary: true
show_overall_results: true
show_category_results: true
# Age/gender/distance/team breakdown page.
show_demographics: false
# Show in-progress result pages before racers finish.
display_unfinished_in_category: false
display_unfinished_in_overall: false

# --- Layout ---
# Number of leader rows pinned at the top.
pinned_leaders: 3
# Pinned leaders row + medal coloring on Overall-tier pages.
pinned_leaders_on_overall_results: false
# Overall result table layout: standard or detailed.
overall_results_layout: standard
# Minutes per bucket in the finish chart.
chart_bucket_minutes: 15

# --- Appearance ---
# dark or light.
color_scheme: dark
# Toast notifications when racers finish.
show_toasts: true
